[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mae-vit-label-efficient-segmentation"
version = "0.1.0"
description = "Reference MAE-ViT training for label-efficient semantic segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "Pillow>=9.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
viz = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
